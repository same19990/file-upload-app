<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق رفع الملفات</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{
  margin:0;
  background:#f4f6f8;
  color:#222;
}
.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  padding:22px;
  border-radius:18px;
  margin-top:20px;
  box-shadow:0 4px 15px #0001;
}
h1{text-align:center}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:16px;
}
button{
  background:#111;
  color:white;
  border:0;
  cursor:pointer;
}
button:hover{opacity:.9}
.points{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin:20px 0;
}
.hidden{display:none}
.message{
  text-align:center;
  margin-top:12px;
  color:#555;
}
.logout{
  background:#d33;
}
</style>
</head>

<body>

<div class="container">

<!-- تسجيل الدخول -->
<div id="loginPage" class="card">
<h1>🔐 تسجيل الدخول</h1>

<input id="password" type="password" placeholder="كلمة السر">

<button onclick="login()">دخول</button>

<div id="loginMessage" class="message"></div>
</div>


<!-- التطبيق -->
<div id="appPage" class="hidden">

<div class="card">
<h1>📁 رفع الملفات</h1>

<div class="points">
النقاط: <span id="points">0</span>
</div>

<input type="file" id="fileInput">

<button onclick="uploadFile()">رفع الملف</button>

<div id="uploadMessage" class="message"></div>
</div>

<div class="card">
<h2>❤️ الحصول على النقاط</h2>

<p>
يمكنك استخدام النقاط داخل التطبيق عند توفر الخدمات.
</p>

<button onclick="addPoints()">إضافة نقطة تجريبية</button>
</div>

<div class="card">
<button class="logout" onclick="logout()">تسجيل الخروج</button>
</div>

</div>

</div>

<script>

const PASSWORD = "123456";

let points = Number(localStorage.getItem("points")) || 0;

function updatePoints(){
  document.getElementById("points").textContent = points;
}

function login(){

  const password =
    document.getElementById("password").value;

  if(password === PASSWORD){

    document.getElementById("loginPage")
      .classList.add("hidden");

    document.getElementById("appPage")
      .classList.remove("hidden");

    updatePoints();

  }else{

    document.getElementById("loginMessage")
      .textContent = "كلمة السر غير صحيحة";
  }
}

function logout(){

  document.getElementById("appPage")
    .classList.add("hidden");

  document.getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("password").value = "";
}

function uploadFile(){

  const file =
    document.getElementById("fileInput").files[0];

  if(!file){

    document.getElementById("uploadMessage")
      .textContent = "اختر ملفًا أولًا";

    return;
  }

  document.getElementById("uploadMessage")
    .textContent =
    "تم اختيار الملف: " + file.name;
}

function addPoints(){

  points++;
  localStorage.setItem("points", points);
  updatePoints();
}

</script>

</body>
</html>
